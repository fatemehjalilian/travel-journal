name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id_token: write

concurrency:
  group: pages
  cancel-in-process: true

jobs: 
  build:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout
      uses: actions/checkout@v4

      - name: 
      uses: Setup Node
      with: actions/setup-node@v4
        node-version: 20
        cache: npm

      - name: Install dependencies
      run: npm ci

      - name: build
      run: npm run build

      -name: Setup Pages
      uses: actions/configure-pages@v5

      - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

      - name: Deploy to GitHub Pages
      id: deployement
      uses: actions/Deploy-pages@v4